(()=>{

function placePhraseByHour(){textBlock.style.top=(new Date().getHours()*LINE_HEIGHT)+'px';placeSwitcherOnGrid()}

function pointAt(state,t,lane){
 const id=lane.id,energy=state.energy||0,band=H*(.17+id*.22),ox=lane.offsetX||0,oy=lane.offsetY||0;
 if(state.name==='sky'){
  const cycle=((t%(Math.PI*2))+Math.PI*2)%(Math.PI*2),progress=cycle<Math.PI?cycle/Math.PI:2-cycle/Math.PI;

 }

function reactToClick(state,x,y){

 state.compress=Math.min(1,state.compress+.85);
 const isSky=state.name==='sky';
 for(const lane of state.lanes){
  const leader=lane.people[0];if(!leader)continue;
  let dx=x-leader.x,dy=y-leader.y,d=Math.hypot(dx,dy);if(d<1){dx=rand(-1,1);dy=rand(-1,1);d=Math.hypot(dx,dy)||1}

function addPerson(state,lane,x=null,y=null,angle=null){if(state.people.length>=MAX_PEOPLE)return;const prev=lane.people[lane.people.length-1];if(x===null&&prev){x=prev.x-Math.cos(prev.angle)*SPACING;y=prev.y-Math.sin(prev.angle)*SPACING;angle=prev.angle}const p={x:x===null?W*.5:x,y:y===null?H*.5:y,angle:angle===null?0:angle,facing:angle===null||Math.cos(angle)>=0?1:-1,phase:rand(0,Math.PI*2),pace:rand(2.35,3.65),spacing:state.name==='ground'?rand(26,44):rand(30,48),drift:state.name==='ground'?rand(20,58):0,driftSpeed:rand(.65,1.2),kickX:0,kickY:0,kind:kinds[Math.floor(rand(0,kinds.length))],lastImpact:-1000,flash:0,lane};state.people.push(p);lane.people.push(p);return p}
